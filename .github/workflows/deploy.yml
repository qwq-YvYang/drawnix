name: Build and Deploy Static Site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t static-site .

      - name: Create output directory
        run: mkdir -p output

      - name: Extract static files from container
        run: |
          docker create --name extract static-site
          docker cp extract:/builder/dist/apps/web ./output
          docker rm extract

      - name: Deploy to page branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output/web
          publish_branch: page
          force_orphan: true
